# Conda environment for abbot development (incl. the NiceGUI frontend).
#
#   conda env create -f environment.yml
#   conda activate abbot
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e '.[ui,dev]'      # editable install + UI/dev extras
#   python -m abbot.ui              # launch the lab frontend
#
# torch comes from pip, not conda: PyTorch's own index is the reliable way to
# pick a build. The CPU build above is fine for the UI and the tests. For an
# NVIDIA GPU, install a CUDA build instead, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# (the right tag for your driver is listed at https://pytorch.org/get-started).
name: abbot
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
