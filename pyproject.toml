[project]
name = "abbot"
version = "0.2.1"
description = "Goal-driven Bayesian experimental design for the lab."
authors = [{name = "Sean Gasiorowski"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Core deps: BoTorch is the surrogate substrate (its Model/Posterior ABC IS the
# surrogate-agnostic layer). gest-api (pydantic-only) carries the VOCS/Generator
# standard for interop. torch/numpy/pydantic are the shared primitives.
dependencies = [
    "torch>=2.7",
    "botorch>=0.18",
    "numpy>=1.26",
    "pydantic>=2",
    "gest-api",
]

[project.scripts]
abbot-mcp = "abbot.agent.launch:main"

[project.urls]
Repository = "https://github.com/sgasioro/abbot"
Issues = "https://github.com/sgasioro/abbot/issues"

[project.optional-dependencies]
# Orchestrator / Badger path. Core never hard-depends on Xopt.
xopt = ["xopt>=3.2"]
# Simulation-based inference as a composite objective.
sbi = ["sbi>=0.22,<0.23", "pyro-ppl>=1.9"]
# Web frontend. NiceGUI is FastAPI-based; plotly for live progress plots.
ui = ["nicegui>=1.4", "plotly>=5"]
# Agent access: an MCP server over named, saved campaigns (`abbot-mcp`); matplotlib
# draws its plots (abbot.plots).
mcp = ["mcp>=2.3,<3", "matplotlib>=3.9"]
dev = ["pytest>=8", "ruff>=0.8"]
# Example notebooks (examples/*.ipynb) + headless execution for the smoke test.
examples = ["jupyter", "nbclient>=0.10", "nbformat>=5", "matplotlib>=3.9"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/abbot"]

# The Claude Code skill lives at skills/abbot in the repository; `abbot-mcp setup`
# installs it from the wheel.
[tool.hatch.build.targets.wheel.force-include]
"skills/abbot/SKILL.md" = "abbot/agent/skill/SKILL.md"

[tool.ruff]
line-length = 88
# Generated teaching notebooks: outputs are built by examples/_build_notebooks.py,
# and import-ordering / didactic import style in cells isn't worth enforcing.
extend-exclude = ["examples/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test tiers: the default suite runs everything; `pytest -m "not slow"` runs only
# the fast unit layer (canned tensors, no GP fits) in a few seconds. The `slow`
# tier is the GP-fitting / policy / end-to-end integration tests — run before
# committing, not on every interactive change.
markers = [
    "slow: GP-fitting / integration test (deselect with -m 'not slow')",
]
